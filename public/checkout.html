<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Checkout — Vaultly</title>
<link rel="icon" type="image/svg+xml" href="/img/logo-icon.svg"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
<style>
  :root{--bg:#0B1020;--bg2:#141A2E;--accent:#FF6B35;--orange:var(--accent);--text:#E8ECF5;--muted:#8A93A8;--line:#2a3350;--field:#0E1426}
  body.theme-light{--bg:#F1F5F9;--bg2:#FFFFFF;--text:#0F172A;--muted:#64748B;--line:#E2E8F0;--field:#F8FAFC}
  *{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh;align-items:center;justify-content:center;padding:20px}
  .card{background:var(--bg2);border:1px solid var(--line);border-radius:16px;max-width:440px;width:100%;padding:28px}
  .logo{height:34px;margin-bottom:18px}
  .seller-logo{display:block;max-height:46px;margin:0 auto 14px;width:auto}
  h1{font-size:20px;margin:0 0 4px}.desc{color:var(--muted);font-size:14px;margin:0 0 18px}
  .price{font-size:30px;font-weight:700;color:var(--accent);margin:8px 0 18px;display:flex;align-items:baseline;flex-wrap:wrap;gap:6px}
  .old{text-decoration:line-through;color:var(--muted);font-size:17px;font-weight:600}
  .promo-badge{background:rgba(34,197,94,0.12);color:#16a34a;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px}
  label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
  input,select{width:100%;padding:11px 12px;border-radius:9px;border:1px solid var(--line);background:var(--field);color:var(--text);font-size:14px}
  .methods{display:flex;gap:8px;margin:16px 0}
  .methods button{flex:1;padding:10px;border-radius:9px;border:1px solid var(--line);background:var(--field);color:var(--text);cursor:pointer}
  .methods button.active{border-color:var(--accent);color:var(--accent)}
  .pay{width:100%;margin-top:18px;padding:13px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-weight:700;font-size:15px;cursor:pointer}
  .pay:disabled{opacity:.6;cursor:not-allowed}
  .msg{margin-top:14px;font-size:14px;text-align:center}
  .pix-box{text-align:center;margin-top:16px}.pix-box img{width:200px;border-radius:8px;background:#fff;padding:8px}
  .copy{word-break:break-all;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:12px;margin-top:10px}
  .guarantee{display:flex;align-items:center;gap:8px;background:rgba(34,197,94,0.10);border:1px solid rgba(34,197,94,0.25);color:#16a34a;border-radius:10px;padding:10px 12px;font-size:12px;font-weight:600;margin-top:14px}
  .vaultly-seal{display:flex;align-items:center;justify-content:center;gap:6px;color:var(--muted);font-size:11px;margin-top:18px}
  .foot{color:var(--muted);font-size:11px;text-align:center;margin-top:10px}
  .hidden{display:none}
</style>
</head>
<body>
  <div class="card">
    <div id="loading" class="msg">Carregando…</div>
    <div id="content" class="hidden">
      <img id="seller-logo" class="seller-logo" alt="" style="display:none;"/>
      <h1 id="title"></h1>
      <p class="desc" id="desc"></p>
      <div class="price"><span id="old-price" class="old" style="display:none;"></span><span id="price"></span><span id="promo-badge" class="promo-badge" style="display:none;"></span></div>
      <div id="fee-note" style="font-size:11px;color:var(--muted);margin-top:6px;display:none;"></div>

      <div class="methods" id="methods">
        <button data-m="pix" class="active">Pix</button>
        <button data-m="card">Cartão</button>
      </div>

      <div id="form-common">
        <label>Nome</label><input id="buyer_name" autocomplete="name"/>
        <label>Email</label><input id="buyer_email" type="email" autocomplete="email"/>
        <label>CPF</label><input id="buyer_doc" inputmode="numeric"/>
      </div>

      <div id="card-fields" class="hidden">
        <label>Parcelas</label><select id="cc_installments"></select>
        <label>Número do cartão</label><input id="cc_number" inputmode="numeric"/>
        <label>Nome no cartão</label><input id="cc_name"/>
        <label>Validade (MM/AAAA)</label><input id="cc_exp"/>
        <label>CVV</label><input id="cc_cvv" inputmode="numeric"/>
      </div>

      <button class="pay" id="pay">Pagar</button>
      <div class="msg" id="msg"></div>

      <div class="pix-box hidden" id="pix-box">
        <p>Escaneie o QR Code para pagar:</p>
        <img id="pix-img" alt="QR Code Pix"/>
        <div class="copy" id="pix-copy"></div>
        <p class="desc" style="margin-top:10px">Após o pagamento, o produto chega no seu email automaticamente.</p>
      </div>

      <div id="guarantee-badge" class="guarantee" style="display:none;"><i class="ti ti-shield-check"></i> Garantia de 7 dias — devolução garantida.</div>
      <a class="vaultly-seal" href="https://vaultly.digital" target="_blank" rel="noopener" style="text-decoration:none;"><i class="ti ti-lock"></i> Pagamento processado com segurança pela <strong style="margin-left:3px;">Vaultly</strong></a>
      <p class="foot">A Vaultly não se responsabiliza pelo conteúdo do produto. <a href="/termos" style="color:var(--muted)">Termos</a></p>
    </div>
  </div>

<script>
const slug = location.pathname.split('/').pop();
let method = 'pix';
const $ = id => document.getElementById(id);

async function load(){
  const r = await fetch('/api/checkout/' + slug);
  const d = await r.json();
  if(!d.success){ $('loading').textContent = 'Produto não encontrado.'; return; }
  var cfg = d.product.checkout || {};
  if (cfg.theme === 'light') document.body.classList.add('theme-light');
  document.documentElement.style.setProperty('--accent', cfg.accent || '#FF6B35');
  if (cfg.logo_url) { var lg = $('seller-logo'); lg.src = cfg.logo_url; lg.style.display = 'block'; }
  if (cfg.show_guarantee) { var gb = $('guarantee-badge'); if (gb) gb.style.display = 'flex'; }
  window._pixCents = d.product.pix_cents;
  if (d.product.compare_at_cents) {
    var op = $('old-price'); if (op) { op.textContent = 'R$ ' + (d.product.compare_at_cents/100).toFixed(2).replace('.', ','); op.style.display = 'inline'; }
    var pct = Math.round((1 - d.product.pix_cents / d.product.compare_at_cents) * 100);
    var pb = $('promo-badge'); if (pb && pct > 0) { pb.textContent = '-' + pct + '%'; pb.style.display = 'inline-block'; }
  }
  window._cardCents = d.product.card_cents;
  window._passFee = d.product.pass_card_fee;
  window._installments = d.product.installments || [{ n:1, total_cents: d.product.card_cents, parcela_cents: d.product.card_cents, label:'1x' }];
  $('title').textContent = d.product.title;
  $('desc').textContent = d.product.description || '';
  $('price').textContent = 'R$ ' + (window._pixCents/100).toFixed(2).replace('.', ',');
  // esconde métodos não aceitos
  document.querySelectorAll('#methods button').forEach(b=>{
    if(b.dataset.m==='pix' && !d.product.accept_pix) b.remove();
    if(b.dataset.m==='card' && !d.product.accept_card) b.remove();
  });
  const first = document.querySelector('#methods button');
  if(first){ method = first.dataset.m; setMethod(method); }
  $('loading').classList.add('hidden'); $('content').classList.remove('hidden');
}

function setMethod(m){
  method = m;
  document.querySelectorAll('#methods button').forEach(b=>b.classList.toggle('active', b.dataset.m===m));
  $('card-fields').classList.toggle('hidden', m!=='card');
  if (m === 'card') {
    var sel = $('cc_installments');
    if (sel && !sel.dataset.filled) {
      sel.innerHTML = (window._installments || []).map(function(o){ return '<option value="'+o.n+'">'+o.label+'</option>'; }).join('');
      sel.dataset.filled = '1';
      sel.onchange = updateCardTotal;
    }
    updateCardTotal();
  } else {
    if (window._pixCents != null) $('price').textContent = 'R$ ' + (window._pixCents/100).toFixed(2).replace('.', ',');
    var note0 = $('fee-note'); if (note0) note0.style.display = 'none';
  }
}

function selectedInstallments(){
  var sel = $('cc_installments');
  var n = sel ? parseInt(sel.value || '1', 10) : 1;
  return (window._installments || []).find(function(o){ return o.n === n; }) || { n:1, total_cents: window._cardCents };
}

function updateCardTotal(){
  var opt = selectedInstallments();
  if (opt && opt.total_cents != null) {
    $('price').textContent = 'R$ ' + (opt.total_cents/100).toFixed(2).replace('.', ',');
  }
  var note = $('fee-note');
  if (note) {
    if (window._passFee) { note.textContent = 'No cartao, a taxa de processamento e a antecipacao estao incluidas no valor.'; note.style.display = 'block'; }
    else { note.style.display = 'none'; }
  }
}
document.getElementById('methods').addEventListener('click', e=>{ if(e.target.dataset.m) setMethod(e.target.dataset.m); });

$('pay').addEventListener('click', async ()=>{
  $('msg').textContent=''; $('pay').disabled=true; $('pay').textContent='Processando…';
  const body = {
    buyer_name: $('buyer_name').value, buyer_email: $('buyer_email').value,
    buyer_doc: $('buyer_doc').value.replace(/\D/g,''), method
  };
  if(method==='card'){
    body.installments = selectedInstallments().n;
    const exp = $('cc_exp').value.split('/');
    body.card = {
      creditCard: { holderName: $('cc_name').value, number: $('cc_number').value.replace(/\s/g,''),
        expiryMonth: (exp[0]||'').trim(), expiryYear: (exp[1]||'').trim(), ccv: $('cc_cvv').value },
      holderInfo: { name: $('buyer_name').value, email: $('buyer_email').value, cpfCnpj: body.buyer_doc,
        postalCode: '00000000', addressNumber: '0', phone: '' }
    };
  }
  try{
    const r = await fetch('/api/checkout/' + slug, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
    const d = await r.json();
    if(!d.success){ $('msg').textContent = d.error || 'Falha no pagamento.'; $('pay').disabled=false; $('pay').textContent='Pagar'; return; }
    if(d.method==='pix'){
      $('pay').classList.add('hidden'); $('card-fields').classList.add('hidden'); $('form-common').classList.add('hidden'); $('methods').classList.add('hidden');
      $('pix-img').src = 'data:image/png;base64,' + d.pix.encodedImage;
      $('pix-copy').textContent = d.pix.payload;
      $('pix-box').classList.remove('hidden');
    } else {
      const ok = ['CONFIRMED','RECEIVED','RECEIVED_IN_CASH'].includes(d.status);
      $('msg').textContent = ok ? 'Pagamento aprovado! O produto chegará no seu email.' : 'Pagamento ' + (d.status||'pendente') + '. Você receberá por email quando confirmado.';
      $('pay').textContent = ok ? 'Aprovado ✓' : 'Aguardando';
    }
  }catch(e){ $('msg').textContent='Erro de conexão.'; $('pay').disabled=false; $('pay').textContent='Pagar'; }
});

load();
</script>
</body>
</html>
